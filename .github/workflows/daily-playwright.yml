name: Daily Playwright Test

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      host:
        description: "Zu testende Adresse"
        required: false
        default: ""

      account_username:
        description: "Benutzername"
        required: false
        default: ""

      account_password:
        description: "Passwort"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-playwright-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    # Enthält Chromium, Firefox, WebKit und alle benötigten
    # Linux-Systemabhängigkeiten.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --user 1001 --ipc=host

    # Innerhalb eines Job-Containers wäre der Standard sonst "sh".
    defaults:
      run:
        shell: bash

    env:
      CI: "true"

      # Verhindert versehentliche Browser-Downloads während npm ci.
      # Die Browser befinden sich bereits im Docker-Image.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v6

      # Bleibt enthalten, damit garantiert Node.js 24 verwendet wird
      # und der npm-Cache über GitHub Actions verfügbar ist.
      - name: Node.js einrichten und npm cachen
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependencies installieren
        run: npm ci --prefer-offline --no-audit --fund=false

      # Docker-Image und npm-Paket müssen dieselbe Version verwenden.
      - name: Playwright-Version prüfen
        run: |
          EXPECTED_VERSION="1.61.0"

          INSTALLED_VERSION="$(
            node -p "require('./node_modules/@playwright/test/package.json').version"
          )"

          echo "Docker-Image-Version: $EXPECTED_VERSION"
          echo "Installierte npm-Version: $INSTALLED_VERSION"

          if [ "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Die Playwright-Version stimmt nicht mit dem Docker-Image überein."
            echo "::error::Erwartet: $EXPECTED_VERSION"
            echo "::error::Installiert: $INSTALLED_VERSION"
            echo "::error::Bitte folgenden Befehl lokal ausführen und package-lock.json committen:"
            echo "::error::npm install --save-dev --save-exact @playwright/test@$EXPECTED_VERSION"
            exit 1
          fi

      - name: Env-Datei erstellen
        env:
          HOST_VALUE: ${{ inputs.host || secrets.HOST }}
          USER_VALUE: ${{ inputs.account_username || secrets.ACCOUNT_USERNAME }}
          PASS_VALUE: ${{ inputs.account_password || secrets.ACCOUNT_PASSWORD }}
        run: |
          {
            printf 'HOST=%s\n' "$HOST_VALUE"
            printf 'ACCOUNT_USERNAME=%s\n' "$USER_VALUE"
            printf 'ACCOUNT_PASSWORD=%s\n' "$PASS_VALUE"
          } > .env

          chmod 600 .env

      - name: Tests ausführen
        id: run_tests
        continue-on-error: true
        run: npx playwright test

      - name: Mail-Inhalt erstellen
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            echo "MAIL_SUBJECT=Playwright Test - success" >> "$GITHUB_ENV"

            cat > mail-body.html <<EOF
          <h2>Playwright Test</h2>
          <p>Status: ✅ Erfolgreich</p>
          <p>
            <a href="$RUN_URL">GitHub Action öffnen</a>
          </p>
          EOF
          else
            echo "MAIL_SUBJECT=Playwright Test - failure" >> "$GITHUB_ENV"

            cat > mail-body.html <<EOF
          <h2>Playwright Test</h2>
          <p>Status: ❌ Fehlgeschlagen</p>
          <p>
            <a href="$RUN_URL">GitHub Action öffnen</a>
          </p>
          EOF
          fi

      - name: Fehlgeschlagene Playwright-Dateien sammeln
        if: always()
        run: |
          mkdir -p failed-playwright-files

          if [ ! -d "test-results" ]; then
            echo "Kein test-results-Verzeichnis vorhanden."
            exit 0
          fi

          find test-results -type f \
            \( \
              -name "*.png" \
              -o -name "error-context.md" \
            \) \
            -exec cp --parents '{}' failed-playwright-files/ ';'

          echo "Gesammelte Dateien:"
          find failed-playwright-files -type f -print || true

      - name: Fehlgeschlagene Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failed-files
          path: failed-playwright-files
          retention-days: 7
          if-no-files-found: ignore

      - name: E-Mail senden
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ env.MAIL_SUBJECT }}
          to: ${{ secrets.MAIL_TO }}, ${{ secrets.MAIL_TO_2 }}
          from: ${{ secrets.MAIL_FROM }}
          html_body: file://mail-body.html

      - name: Workflow fehlschlagen lassen, wenn Tests fehlgeschlagen sind
        if: always() && steps.run_tests.outcome != 'success'
        run: |
          echo "Mindestens ein Playwright-Test ist fehlgeschlagen."
          echo "Bitte die Artifacts und den Playwright-Bericht prüfen."
          exit 1
